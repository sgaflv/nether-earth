# JVM settings for the Gradle daemon. The build is small; 2 GB is plenty.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# This project deliberately has no AndroidX / support-library dependencies:
# the Activity is plain framework code and there is no SDL.
android.useAndroidX=false
